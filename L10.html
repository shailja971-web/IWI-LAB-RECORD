<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Div and Span Layout</title>
  <style>
    /* Layout styling with div */
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: #f0f0f0;
      border-radius: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .box {
      flex: 1;
      margin: 0 0.5rem;
      padding: 1rem;
      background-color: #0077cc;
      color: white;
      text-align: center;
      border-radius: 4px;
    }

    /* Inline styling with span */
    .highlight {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Layout with Div and Span</h1>

    <div class="row">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>

    <p>
      This is a paragraph with an <span class="highlight">important word</span> highlighted using a span.
    </p>
  </div>

</body>
</html>
